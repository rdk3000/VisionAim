name: Build VisionAim Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download YOLO pose model
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolo11n-pose.pt')"
          New-Item -ItemType Directory -Force models
          Copy-Item "$env:USERPROFILE\.cache\ultralytics\yolo11n-pose.pt" models\yolo11n-pose.pt
        shell: pwsh

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --name VisionAim --onedir --collect-all ultralytics --collect-all cv2 --collect-all dxcam --add-data "models;models" main.py

      - name: Zip application
        run: Compress-Archive -Path dist\VisionAim\* -DestinationPath VisionAim-Windows.zip
        shell: pwsh

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: VisionAim-Windows
          path: VisionAim-Windows.zip
          retention-days: 7
